services:
  sentinel:
    build: ./orchestrator
    env_file: [.env]
    environment:
      SENTINEL_DB: /data/sentinel.sqlite
      TARGET_REPO: ${TARGET_REPO:-Soham4001A/superset-cognition-demo}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    ports: ["8080:8080"]
    volumes: ["./data:/data", "./compliance:/compliance"]
